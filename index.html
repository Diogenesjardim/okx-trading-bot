<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <script>
      // Se um arquivo do app não carregar (cache antigo após nova publicação), recarrega UMA vez sem cache.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          try {
            if (sessionStorage.getItem('okxbot.reloaded')) return;
            sessionStorage.setItem('okxbot.reloaded', '1');
          } catch (_) {}
          location.replace(location.pathname + '?v=' + Date.now() + location.hash);
        }
      }, true);
      window.addEventListener('load', function () {
        setTimeout(function () { try { sessionStorage.removeItem('okxbot.reloaded'); } catch (_) {} }, 5000);
      });
    </script>
    <title>OKX Trading Bot Dashboard</title>
  </head>
  <body class="bg-zinc-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
