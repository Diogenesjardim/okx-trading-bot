name: Robô na nuvem

# Fase 4: roda o Robô Analista + Simulador a cada ~5 min, sem depender do PC ou do iPhone,
# e espelha as entradas/saídas na conta de Trading simulado (Demo) da OKX via função okx-demo.
# Configuração: bot/config.json  ·  Estado: branch "bot-state" (state.json), lido pelo site.
# Requer o secret BOT_TOKEN (o mesmo cadastrado no Supabase). As chaves da OKX ficam só no Supabase.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo-nuvem
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Baixar estado anterior
        run: |
          mkdir -p state
          if git fetch -q --depth=1 origin bot-state 2>/dev/null; then
            git show FETCH_HEAD:state.json > state/state.json || rm -f state/state.json
          fi
      - name: Executar um ciclo do robô
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_FN: https://${{ vars.SUPABASE_PROJECT_REF || 'puwrgxthizmydhzvdpvh' }}.supabase.co/functions/v1
          STATE_DIR: state
        run: npx tsx bot/run.ts
      - name: Salvar estado (branch bot-state, 1 commit só)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd state
          git init -q -b bot-state
          git config user.name "robo-nuvem"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -qm "estado $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:bot-state
