name: Publicar funções no Supabase

# Publica as Edge Functions (okx-demo, okx-proxy e bot-cycle = robô na nuvem) no seu projeto Supabase.
# Requer no GitHub (Settings → Secrets and variables → Actions):
#   Secret:   SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#   Variable: SUPABASE_PROJECT_REF   (o código do projeto, ex.: abcdxyzkqlmn)
# As chaves da OKX NÃO ficam no GitHub: são cadastradas direto nos Secrets do Supabase.

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'src/lib/**', 'src/types.ts', 'bot/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'puwrgxthizmydhzvdpvh' }}  # código do projeto (não é segredo)
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuração
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Configure SUPABASE_ACCESS_TOKEN (secret) e SUPABASE_PROJECT_REF (variable) para publicar as funções."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: supabase/setup-cli@v1
        if: env.SKIP != '1'
        with:
          version: latest
      - name: Testar executor e robô na nuvem; gerar o motor da nuvem
        if: env.SKIP != '1'
        run: |
          npm ci
          npx vitest run src/lib/okxDemoLogic.test.ts src/lib/cloudCycle.test.ts
          npm run build:engine
      - name: Publicar okx-demo
        if: env.SKIP != '1'
        run: supabase functions deploy okx-demo --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Publicar okx-proxy
        if: env.SKIP != '1'
        run: supabase functions deploy okx-proxy --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Publicar bot-cycle (robô na nuvem)
        if: env.SKIP != '1'
        run: supabase functions deploy bot-cycle --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Conferir robô na nuvem (GET, só leitura)
        if: env.SKIP != '1'
        run: |
          sleep 5
          curl -s -m 30 "https://$PROJECT_REF.supabase.co/functions/v1/bot-cycle?forceFunctionRegion=sa-east-1" > estado.json || true
          jq -r 'if .ok then (.data // {}) | "execuções: \(.runs) · última OK: \((.lastOkAt // 0) / 1000 | todate) · simulador: \(.sim.mode) · posição: \(.sim.position.instId // "nenhuma") · erro: \(.analyst.lastError // "-") · logs de config: \([.sim.log[]? | select(.msg | test("Configurações do simulador"))] | length) · último log demo: \(.demo.log[0].msg // "-")" else "ERRO: \(.error)" end' estado.json || head -c 400 estado.json
